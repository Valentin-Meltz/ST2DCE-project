name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  TF_VERSION: "1.17.2"
  # Immutable tag: the commit SHA. No "latest" tag is ever pushed.
  IMAGE: ghcr.io/valentin-meltz/task-api:${{ github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Unit tests with coverage (fails under 80 % of lines)
        run: npm run test:ci
      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-report
          path: app/test-results/junit.xml

  integration-tests:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: taskapi
          POSTGRES_DB: taskapi
          # Throwaway database that only exists for this job, so no password is needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskapi -d taskapi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: taskapi
      DB_NAME: taskapi
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (production dependencies, fails on high and critical)
        working-directory: app
        run: npm run audit
      - name: Trivy filesystem scan (fails on high and critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform (fmt, validate, plan)
    runs-on: ubuntu-24.04
    env:
      # Same environment name as the ephemeral-env job, so the plan shows what it creates.
      ENV_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Plain terraform binary, so `terraform output -raw` prints raw values.
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Init (providers checked against the committed .terraform.lock.hcl)
        run: terraform init -input=false -lockfile=readonly
      - name: Validate
        run: terraform validate
      - name: Plan
        run: |
          terraform workspace select -or-create "$ENV_NAME"
          terraform plan -input=false -no-color -out=tfplan
          {
            echo "### Terraform plan (environment \`$ENV_NAME\`)"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build, scan and push image
    needs: [lint, unit-tests, integration-tests, dependency-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$IMAGE" \
            .
      - name: Check that the container starts (non-root, read-only filesystem)
        run: |
          docker run --detach --name smoke --read-only --publish 3000:3000 "$IMAGE"
          if ! curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://localhost:3000/health \
            | jq --exit-status --arg sha "$GITHUB_SHA" '.version == $sha'; then
            docker logs smoke
            exit 1
          fi
          docker rm --force smoke
      - name: Trivy image scan (fails on high and critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push image (main only, an existing tag is never overwritten)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE already exists in the registry, keeping it."
          else
            docker push "$IMAGE"
          fi

  deploy:
    name: Deploy to Kubernetes (ephemeral kind cluster)
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      NAMESPACE: task-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create kind cluster
        run: kind create cluster --name ci --wait 120s
      - name: Create the namespace and the database Secret (random password, never stored in git)
        run: |
          kubectl create namespace "$NAMESPACE"
          kubectl --namespace "$NAMESPACE" create secret generic task-api-db \
            --from-literal=password="$(openssl rand -hex 24)"
      - name: Deploy the image of this commit
        working-directory: k8s
        run: |
          kustomize edit set image "$IMAGE"
          kubectl apply --kustomize .
          kubectl --namespace "$NAMESPACE" annotate deployment/task-api --overwrite \
            kubernetes.io/change-cause="deploy $GITHUB_SHA"
          kubectl --namespace "$NAMESPACE" rollout status statefulset/postgres --timeout=180s
          kubectl --namespace "$NAMESPACE" rollout status deployment/task-api --timeout=180s
      - name: Smoke test through the Service
        run: |
          kubectl --namespace "$NAMESPACE" port-forward service/task-api 8080:80 &
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/ready
          curl --fail --silent --show-error http://localhost:8080/health \
            | jq --exit-status --arg sha "$GITHUB_SHA" '.version == $sha'
          curl --fail --silent --show-error -X POST http://localhost:8080/tasks \
            -H 'content-type: application/json' -d '{"title":"smoke test"}'
      - name: Show cluster state
        if: failure()
        run: |
          kubectl --namespace "$NAMESPACE" get all,pvc
          kubectl --namespace "$NAMESPACE" describe pods
          kubectl --namespace "$NAMESPACE" logs --selector 'app in (task-api,postgres)' --all-containers --prefix --tail=100

  ephemeral-env:
    name: Ephemeral environment (Terraform, create, test, destroy)
    # Pull requests only: main is deployed by the deploy job above.
    if: github.event_name == 'pull_request'
    needs: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENV_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # kind, kubectl, docker and jq are preinstalled on the ubuntu-24.04 runner.
      - name: Create (kind cluster, namespace and Secret by Terraform, app built from this commit)
        run: infra/env.sh up "$ENV_NAME"
      - name: Smoke test through the Service
        run: infra/env.sh test "$ENV_NAME"
      - name: Show cluster state
        if: failure()
        run: infra/env.sh status "$ENV_NAME"
      - name: Destroy (always, even when a step above failed or the run was cancelled)
        if: always()
        run: infra/env.sh down "$ENV_NAME"
